<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de produtos</title>
</head>
<body>
    <p> Lista de produtos</p>
    <ul>
        
        {%for produto in produtos %}
            <li>
                {{produto.nome}}
                {{produto.preco}}
            </li>
        {% empty %}
            <li>Nenhum produto cadastrado</li>
        {% endfor %}
    </ul>
</body>
</html>
