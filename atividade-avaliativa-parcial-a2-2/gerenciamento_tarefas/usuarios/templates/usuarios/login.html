{% extends "base.html" %}

{% block titulo %}Entrar — Gerenciador de Tarefas{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 card-title mb-4 text-center">Entrar</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label">E-mail</label>
                        <input type="email" name="email" id="id_email" class="form-control" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label for="id_senha" class="form-label">Senha</label>
                        <input type="password" name="senha" id="id_senha" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <p class="text-center text-muted small mt-3 mb-0">
                    Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
