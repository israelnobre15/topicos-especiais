{% extends "base.html" %}

{% block titulo %}Cadastro — Gerenciador de Tarefas{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 card-title mb-4 text-center">Criar conta</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for campo in form %}
                        <div class="mb-3">
                            <label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}</label>
                            {{ campo }}
                            {% for erro in campo.errors %}
                                <div class="text-danger small mt-1">{{ erro }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                </form>
                <p class="text-center text-muted small mt-3 mb-0">
                    Já tem conta? <a href="{% url 'login' %}">Entrar</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
