{% extends "base.html" %}

{% block titulo %}Excluir tarefa — Gerenciador de Tarefas{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body p-4 text-center">
                <h1 class="h4 card-title">Excluir tarefa</h1>
                <p class="mb-4">
                    Tem certeza que deseja excluir a tarefa
                    <strong>“{{ tarefa.titulo }}”</strong>?
                    Esta ação não pode ser desfeita.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'tarefa_detalhe' tarefa.id %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Excluir definitivamente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
